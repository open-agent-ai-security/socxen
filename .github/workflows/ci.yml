name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: Repo invariants (no inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deterministic invariant tests
        run: uv run --with pytest pytest -q tests/

      - name: Eval regression harness (recorded runs, no creds)
        # Grades the committed golden run against its fixture — schema, deterministic
        # checks, and the HARD safety gates (no gated close called, no forbidden
        # outcome, no claimed containment). Default mode needs no MCP/credentials.
        run: uv run evals/run.py

      - name: Byte-compile the connector bridge
        run: python -m py_compile connector/exabeam-mcp-bridge.py

#
# DCO sign-off gate for external contributions. Every non-merge commit in a PR
# must carry a Signed-off-by trailer (git commit -s) — see CONTRIBUTING.md.
# Exabeam-internal authors and bots are exempt from the CI gate (though the
# sign-off convention still applies): decided 2026-07-01, deferred in #51 until
# outside contributions arrived.
name: DCO

on:
  pull_request:

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: External commits carry Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            email="$(git log -1 --format='%ae' "$sha")"
            case "$email" in
              *@exabeam.com|*"[bot]"*) echo "exempt: ${sha:0:7} (${email})"; continue ;;
            esac
            if git log -1 --format='%B' "$sha" | grep -Eqi '^Signed-off-by: .+ <.+@.+>'; then
              echo "ok: ${sha:0:7} signed off by $(git log -1 --format='%an <%ae>' "$sha")"
            else
              echo "::error::commit ${sha:0:7} by ${email} has no Signed-off-by trailer — amend with 'git commit --amend -s' (or 'git rebase --signoff' for multiple commits), then force-push your branch. See CONTRIBUTING.md § Developer Certificate of Origin."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "DCO: all commits signed off or exempt"
